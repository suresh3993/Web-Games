name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: suresh
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: suresh_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U suresh"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://suresh:ci_only_password@127.0.0.1:5432/suresh?schema=public
      TEST_DATABASE_URL: postgresql://suresh:ci_only_password@127.0.0.1:5432/suresh_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api -t suresh-api:ci .
      - run: docker build --target web -t suresh-web:ci .
